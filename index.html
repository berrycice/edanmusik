<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />

    <meta name="description" content="Personal music streaming library dengan pemutar audio modern, background playback, dan integrasi Cloudflare R2." />
    <meta property="og:title" content="MUSIK — Personal Music Streaming" />
    <meta property="og:description" content="Personal music streaming library dengan pemutar audio modern, background playback, dan integrasi Cloudflare R2." />
    <meta property="og:type" content="website" />
    <meta name="theme-color" content="#EC4899" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/svg+xml" href="/assets/icon.svg" />
    <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <body class="bg-slate-50 text-slate-900 antialiased selection:bg-pink-500 selection:text-white min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Register Service Worker for PWA
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/service-worker.js')
            .then(reg => console.log('MUSIK ServiceWorker registered:', reg.scope))
            .catch(err => console.log('MUSIK ServiceWorker registration failed:', err));
        });
      }
    </script>
  </body>
